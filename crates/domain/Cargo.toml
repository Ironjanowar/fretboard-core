[package]
name = "fretboard-core"
description = "Portable music domain for Fretboard: catalogs, canonical state, codecs and derivation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "fretboard_core"
path = "src/lib.rs"

# Data-only JSON support, approved by `CORE-D04` in `docs/decisions.md`: the
# snapshot and the page-parameter codecs live in the domain, so serde and
# serde_json are the domain's only dependencies. No UniFFI, Android, JNI,
# platform, filesystem, clock, randomness or network crate belongs here.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
