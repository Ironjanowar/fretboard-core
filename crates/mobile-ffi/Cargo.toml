[package]
name = "fretboard-mobile-ffi"
description = "UniFFI adapter exposing the Fretboard domain to native clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true


[lib]
name = "fretboard_mobile_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
fretboard-core = { workspace = true }
uniffi = { workspace = true }

[dev-dependencies]
# The oracle fixtures are JSON; reading them in the boundary tests needs a JSON
# reader. Test-only, and the same pinned `serde_json` the domain already uses at
# runtime (CORE-D04).
serde_json = "1"

[lints]
workspace = true
